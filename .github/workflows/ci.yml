name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sidecar-tests:
    name: Sidecar tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      # All 131 tests are hermetic (FakeLLM stand-ins, no real Ollama/Claude
      # calls, SQLite created fresh per test via tests/conftest.py) — no
      # external services needed here.
      - name: Run tests
        run: uv run pytest -q

  app-build:
    name: macOS app build + packaging
    # macos-14's default Xcode (15.x) ships Swift 5.10, too old for this
    # package's `swift-tools-version: 6.0` — macos-15's default Xcode (16.4)
    # bundles Swift 6. Confirmed via the runner-images repo's README, not
    # assumed: https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
    runs-on: macos-15
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4

      # The Swift-side XCTest suite (BusinessConsultantTests) — view model
      # logic against a fake SidecarClient, plus the SidecarJSON wire
      # contract. Runs before packaging so a broken test fails fast instead
      # of after the slower build+codesign steps.
      - name: Run Swift tests
        run: swift test

      # Runs the same script a local build uses (Scripts/build-app.sh),
      # not just `swift build` — this also catches a broken bundling/
      # codesigning step, not only a compile failure.
      - name: Build and package the app
        run: ./Scripts/build-app.sh

      - name: Verify the bundle
        run: |
          test -f .build/app/BusinessConsultant.app/Contents/MacOS/BusinessConsultant
          test -f .build/app/BusinessConsultant.app/Contents/Resources/AppIcon.icns
          codesign --verify --verbose .build/app/BusinessConsultant.app
