[project]
name = "business-consulting-sidecar"
version = "0.1.0"
description = "Local backend for the AI business consulting app: ingestion, evidence model, LLM orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "python-dotenv",
    "ollama",
    "anthropic",
    "python-docx",
    "pypdf",
    "openpyxl",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
